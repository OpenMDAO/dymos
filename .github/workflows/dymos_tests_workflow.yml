# Run Tests

name: Dymos Tests

env:
  # Hosted runners do not provide usable RDMA devices for UCX.
  OMPI_MCA_pml: ob1
  OMPI_MCA_osc: ^ucx
  # Parallel test workers should not each start a full BLAS thread pool.
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONFAULTHANDLER: '1'

on:
  # Trigger on push, pull request
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, develop ]

  # Allow running the workflow manually from the Actions tab
  # All jobs are excluded by default, desired jobs must be selected
  workflow_dispatch:

    inputs:

      run_name:
        type: string
        description: 'Name of workflow run as it will appear under Actions tab:'
        required: false
        default: ""

      baseline:
        type: boolean
        description: "Include 'baseline' in test matrix"
        required: false
        default: true

      pep517:
        type: boolean
        description: "Include 'pep517' in test matrix"
        required: false
        default: true

      use_pypi:
        type: boolean
        description: 'Run tests against the published PyPI version of Dymos'
        required: false
        default: false

      dymos_pixi:
        type: boolean
        description: "Include tests of dymos' local pixi environment job"
        required: false
        default: true

      dymos_pixi_openmdao_github:
        type: string
        description: "OpenMDAO ref to install from GitHub in the dev-local test (branch, tag, or commit hash). Leave empty to skip."
        required: false
        default: 'master'

      save_pixi_lock:
        type: boolean
        description: "Upload pixi.lock as a 1-day artifact for each test_dymos_pixi matrix entry"
        required: false
        default: false

concurrency:
  # Cancel any existing CI runs if we push to this branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

run-name:  ${{ inputs.run_name }}

jobs:

  test_dymos_pixi:
    # Test dymos-native pixi environments defined in pyproject.toml using pixi.lock.
    runs-on: ${{ matrix.runs-on }}

    # Keep MKL/OpenBLAS/numpy off AMX-capable code paths on Windows. GitHub's
    # windows-2025/windows-latest runners have a CPUID bug (see comment near the
    # windows-latest matrix entry below) that makes AMX instructions look
    # available when they are not, corrupting the stack on any later hardware
    # fault. matrix.runs-on (not the runner context, which isn't available at
    # job-level env) selects these; they are no-ops on non-Windows runners.
    env:
      MKL_ENABLE_INSTRUCTIONS: ${{ startsWith(matrix.runs-on, 'windows') && 'AVX2' || '' }}
      OPENBLAS_CORETYPE: ${{ startsWith(matrix.runs-on, 'windows') && 'Haswell' || '' }}
      NPY_DISABLE_CPU_FEATURES: ${{ startsWith(matrix.runs-on, 'windows') && 'AVX512_SPR AMX_TILE AMX_BF16 AMX_INT8' || '' }}
      ONEDNN_MAX_CPU_ISA: ${{ startsWith(matrix.runs-on, 'windows') && 'AVX2' || '' }}

    defaults:
      run:
        shell: bash -eo pipefail {0}

    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # default env on all three platforms
          - pixi-env: default
            runs-on: ubuntu-26.04
            EXCLUDE: ${{ github.event_name == 'workflow_dispatch' && !inputs.dymos_pixi }}
          - pixi-env: default
            runs-on: macos-26
            EXCLUDE: ${{ github.event_name == 'workflow_dispatch' && !inputs.dymos_pixi }}
          # windows-2025/windows-latest runners use Emerald Rapids Xeons with a
          # CPUID bug that misreports AMX support (see
          # https://github.com/actions/runner-images/issues/14483). Native libraries
          # that probe for AMX (MKL, OpenBLAS, numpy) then try to use it, which
          # corrupts the stack on the next hardware fault anywhere in the process
          # (see https://github.com/golang/go/issues/81238 for the mechanism) and
          # crashes with "Windows fatal exception: access violation" in unrelated
          # code. Trying windows-latest again with AMX-capable instructions
          # disabled below (MKL_ENABLE_INSTRUCTIONS/OPENBLAS_CORETYPE/etc.); revert
          # to windows-2022 if that is not sufficient.
          - pixi-env: default
            runs-on: windows-latest
            EXCLUDE: ${{ github.event_name == 'workflow_dispatch' && !inputs.dymos_pixi }}
          # remaining envs on Linux only
          - pixi-env: oldest
            runs-on: ubuntu-26.04
            EXCLUDE: ${{ github.event_name == 'workflow_dispatch' && !inputs.dymos_pixi }}
          - pixi-env: dev
            runs-on: ubuntu-26.04
            EXCLUDE: ${{ github.event_name == 'workflow_dispatch' && !inputs.dymos_pixi }}
          # dev-local with OpenMDAO installed from GitHub
          - pixi-env: dev-local
            runs-on: ubuntu-26.04
            install_openmdao_github: true
            EXCLUDE: ${{ github.event_name == 'workflow_dispatch' && inputs.dymos_pixi_openmdao_github == '' }}

    steps:
      - name: Checkout code
        if: ${{ !matrix.EXCLUDE }}
        uses: actions/checkout@v7

      - name: Upload pixi.lock artifact
        if: ${{ !matrix.EXCLUDE && github.event_name == 'workflow_dispatch' && inputs.save_pixi_lock }}
        uses: actions/upload-artifact@v7
        with:
          name: pixi-lock-${{ matrix.pixi-env }}-${{ matrix.runs-on }}
          path: pixi.lock
          retention-days: 1

      - name: Setup pixi
        if: ${{ !matrix.EXCLUDE }}
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: ${{ matrix.pixi-env }}
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

      - name: Install Dymos
        if: ${{ !matrix.EXCLUDE }}
        run: |
          PIXI_SHELL_HOOK=$(pixi shell-hook -e ${{ matrix.pixi-env }} --manifest-path $GITHUB_WORKSPACE/pyproject.toml)
          eval "$PIXI_SHELL_HOOK"
          pip install --no-deps -e $GITHUB_WORKSPACE

      - name: Install OpenMDAO from GitHub
        if: ${{ !matrix.EXCLUDE && matrix.install_openmdao_github }}
        env:
          OPENMDAO_REF: ${{ inputs.dymos_pixi_openmdao_github || 'master' }}
        run: |
          PIXI_SHELL_HOOK=$(pixi shell-hook -e ${{ matrix.pixi-env }} --manifest-path $GITHUB_WORKSPACE/pyproject.toml)
          eval "$PIXI_SHELL_HOOK"
          echo "============================================================="
          echo "Install OpenMDAO from GitHub ref: $OPENMDAO_REF"
          echo "============================================================="
          pip install --no-deps "git+https://github.com/OpenMDAO/OpenMDAO@${OPENMDAO_REF}"

      - name: Check MPI and PETSc
        if: ${{ !matrix.EXCLUDE && runner.os != 'Windows' }}
        run: |
          set -e
          if pixi run -e ${{ matrix.pixi-env }} python -c "import mpi4py, petsc4py" 2>/dev/null; then
            echo "============================================================="
            echo "Check MPI and PETSc installation"
            echo "============================================================="
            export PRTE_MCA_rmaps_default_mapping_policy=:oversubscribe
            export OMPI_MCA_rmaps_base_oversubscribe=1
            export OMPI_MCA_btl=^openib
            echo "-----------------------"
            echo "Quick test of mpi4py:"
            pixi run -e ${{ matrix.pixi-env }} mpirun --timeout 120 -n 3 python -c "from mpi4py import MPI; print(f'Rank: {MPI.COMM_WORLD.rank}')"
            pixi run -e ${{ matrix.pixi-env }} mpirun --timeout 120 -n 3 python -c "from mpi4py import MPI; from petsc4py import PETSc; \
              v = PETSc.Vec().createMPI(3, comm=MPI.COMM_WORLD); v.set(1); assert v.sum() == 3"
            echo "-----------------------"

            # shellcheck disable=SC2129
            echo "PRTE_MCA_rmaps_default_mapping_policy=:oversubscribe" >> "$GITHUB_ENV"
            echo "OMPI_MCA_rmaps_base_oversubscribe=1" >> "$GITHUB_ENV"
            echo "OMPI_MCA_btl=^openib" >> "$GITHUB_ENV"
            echo "Workaround for intermittent failures with OMPI https://github.com/open-mpi/ompi/issues/7393"
            echo "TMPDIR=/tmp" >> "$GITHUB_ENV"
          else
            echo "Required MPI/PETSc installation is missing or broken"
            exit 1
          fi

      - name: Run tests
        id: run_dymos_pixi_tests
        if: ${{ !matrix.EXCLUDE }}
        env:
          OPENMDAO_CHECK_ALL_PARTIALS: True
        continue-on-error: true
        run: |
          HAS_ERRORS=false
          PIXI_SHELL_HOOK=$(pixi shell-hook -e ${{ matrix.pixi-env }} --manifest-path $GITHUB_WORKSPACE/pyproject.toml)
          eval "$PIXI_SHELL_HOOK"
          echo "============================================================="
          echo "Run Tests (pixi environment: ${{ matrix.pixi-env }})"
          echo "============================================================="
          cd $GITHUB_WORKSPACE
          testflo -n 1 docs/dymos_book/test --pre_announce || HAS_ERRORS=true
          testflo -n 1 joss/test --pre_announce || HAS_ERRORS=true
          testflo -b benchmark --pre_announce --nocapture || HAS_ERRORS=true
          # Run the readme test from the checked out directory.
          testflo -n 1 ./dymos/test/test_readme.py --pre_announce || HAS_ERRORS=true
          cd $HOME
          testflo dymos -n 4 --pre_announce --show_skipped --durations 20 || {
            TEST_EXIT_CODE=$?
            echo "::error::Dymos test process exited with status $TEST_EXIT_CODE"
            HAS_ERRORS=true
          }

          if [ "$HAS_ERRORS" = true ]; then
            echo "One or more commands failed"
            exit 1
          fi

      - name: Fail the workflow if tests failed
        if: ${{ !matrix.EXCLUDE && steps.run_dymos_pixi_tests.outcome != 'success' }}
        run: |
          echo "Tests failed"
          exit 1

  coveralls:
    name: Finish coveralls
    if: github.event_name != 'workflow_dispatch'
    continue-on-error: true
    needs: test_ubuntu
    runs-on: ubuntu-26.04
    steps:
    - uses: coverallsapp/github-action@v2.3.8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        parallel-finished: true
