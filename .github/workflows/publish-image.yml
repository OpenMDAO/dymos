name: Publish Images

on:
  release:
    types: [published]

  # Run the workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  build_image:

    strategy:

      fail-fast: false

      matrix:
        include:
          - NAME: ubuntu
            OS: ubuntu-26.04
            FILE: Dockerfile
            IMAGE_NAME: ${{ github.repository }}
            REGISTRY: ghcr.io

          - NAME: ubuntu-arm
            OS: ubuntu-26.04-arm
            FILE: Dockerfile.arm
            IMAGE_NAME: ${{ github.repository }}-arm
            REGISTRY: ghcr.io

    runs-on: ${{ matrix.OS }}

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get tags
        run: |
          git fetch --unshallow --tags
          git describe --tags > tag.txt
          echo "TAG=$(cat tag.txt)" >> $GITHUB_ENV

      # Login to container registry
      - name: Log into registry ${{ matrix.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ matrix.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.REGISTRY }}/${{ matrix.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.TAG }}

      # Build and push image with Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          file: ${{ matrix.FILE }}
          tags: dymos-test:release
          labels: ${{ steps.meta.outputs.labels }}

      - name: Test image and MPI/PETSc
        run: bash .github/scripts/test-docker-image.sh dymos-test:release

      - name: Publish tested Docker image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker tag dymos-test:release "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
